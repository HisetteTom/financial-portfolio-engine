<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Portfolio Engine</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <header>
            <div>
                <h1>Portfolio Engine</h1>
                <div class="subtitle">Multi-asset portfolio management and valuation</div>
            </div>
            <div class="actions">
                <button id="simulateBtn">Simulate 1 day</button>
                <button id="resetBtn" class="btn-secondary">Reset</button>
            </div>
        </header>

        <section class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Total value</div>
                <div class="kpi-value" id="totalValue">0.00 €</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Gains / Losses</div>
                <div class="kpi-value" id="totalPnl">0.00 €</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Available cash</div>
                <div class="kpi-value" id="cashBalance">0.00 €</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Projected annual income</div>
                <div class="kpi-value" id="annualIncome">0.00 €</div>
            </div>
        </section>

        <main>
            <section class="charts-grid">
                <div class="card">
                    <h2>Portfolio value over time</h2>
                    <div class="chart-box">
                        <canvas id="historyChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h2>Asset allocation</h2>
                    <div class="chart-box doughnut-box">
                        <canvas id="allocationChart"></canvas>
                    </div>
                </div>
            </section>

            <section class="bottom-grid">
                <div class="card table-card">
                    <h2>Positions</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Type</th>
                                    <th>Quantity</th>
                                    <th>Avg. cost</th>
                                    <th>Price</th>
                                    <th>Value</th>
                                    <th>P&L</th>
                                    <th>ROI</th>
                                    <th>Weight</th>
                                </tr>
                            </thead>
                            <tbody id="assetsTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card order-card">
                    <h2>Place an order</h2>
                    <form id="orderForm">
                        <div class="form-group">
                            <label for="symbolSelect">Asset</label>
                            <select id="symbolSelect" required></select>
                        </div>
                        <div class="form-group">
                            <label for="type">Side</label>
                            <select id="type">
                                <option value="BUY">Buy</option>
                                <option value="SELL">Sell</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" step="any" id="quantity" min="0.00000001" placeholder="Ex: 5" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Market price</label>
                            <input type="text" id="price" placeholder="Price" readonly>
                        </div>
                        <div class="form-group btn-group">
                            <button type="submit">Execute</button>
                        </div>
                    </form>
                    <div id="orderStatus"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
