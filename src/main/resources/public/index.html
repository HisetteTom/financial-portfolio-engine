<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Portfolio Engine</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-layout">
        <header>
            <div>
                <h1>Portfolio Engine</h1>
                <div class="subtitle">Gestion et valorisation d'actifs multi-classes</div>
            </div>
            <div class="actions">
                <button id="simulateBtn">Simuler 1 jour de marche</button>
            </div>
        </header>

        <section class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Valorisation totale</div>
                <div class="kpi-value" id="totalValue">0.00 €</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Gains / Pertes</div>
                <div class="kpi-value" id="totalPnl">0.00 €</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Liquidites disponibles</div>
                <div class="kpi-value" id="cashBalance">0.00 €</div>
            </div>
        </section>

        <main>
            <section class="charts-grid">
                <div class="card">
                    <h2>Evolution temporelle du portefeuille</h2>
                    <div class="chart-box">
                        <canvas id="historyChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h2>Repartition des actifs</h2>
                    <div class="chart-box doughnut-box">
                        <canvas id="allocationChart"></canvas>
                    </div>
                </div>
            </section>

            <section class="bottom-grid">
                <div class="card table-card">
                    <h2>Positions detenues</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Symbole</th>
                                    <th>Quantite</th>
                                    <th>PRU</th>
                                    <th>Cours</th>
                                    <th>Valeur</th>
                                    <th>P&L</th>
                                    <th>Poids</th>
                                </tr>
                            </thead>
                            <tbody id="assetsTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card order-card">
                    <h2>Passer un ordre</h2>
                    <form id="orderForm">
                        <div class="form-group">
                            <label for="symbolSelect">Actif</label>
                            <select id="symbolSelect" required></select>
                        </div>
                        <div class="form-group">
                            <label for="type">Sens</label>
                            <select id="type">
                                <option value="BUY">Achat</option>
                                <option value="SELL">Vente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Quantite</label>
                            <input type="number" step="any" id="quantity" min="0.00000001" placeholder="Ex: 5" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Prix unitaire</label>
                            <input type="number" step="any" id="price" min="0.01" placeholder="Cours" required>
                        </div>
                        <div class="form-group btn-group">
                            <button type="submit">Executer</button>
                        </div>
                    </form>
                    <div id="orderStatus"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
